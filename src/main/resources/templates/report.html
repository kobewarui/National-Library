<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="description" content="">
<meta name="author" content="">

<title>PROFILE</title>

<!-- Custom fonts for this template-->
<link th:href="@{/vendor/fontawesome-free/css/all.min.css}"
	rel="stylesheet" type="text/css">
<link
	th:href="@{https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i}"
	rel="stylesheet">

<!-- Custom styles for this template-->
<link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
<link th:href="@{/css/main.css}" rel="stylesheet">
<link
	th:href="@{https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css}"
	rel="stylesheet"
	integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
	crossorigin="anonymous" />

</head>
<body id="page-top">

	<!-- Page Wrapper -->
	<div id="wrapper">

		<ul th:replace="layouts::sidebar"></ul>

		<!-- Content Wrapper -->
		<div id="content-wrapper" class="d-flex flex-column">

			<!-- Main Content -->
			<div id="content">

				<nav th:replace="layouts::topbar"></nav>

				<!-- Begin Page Content -->
				<div class="container-fluid">

					<!-- Page Heading -->
					<div class="d-sm-flex align-items-center justify-content-between mb-4">
						<h1 class="h3 mb-0 text-gray-800">Library Report</h1>
					</div>

					<!-- Stock Row -->
					<div class="row">

						<div class="col-xl-3 col-md-6 mb-4">
							<div class="card border-left-primary shadow h-100 py-2">
								<div class="card-body">
									<div class="text-xs font-weight-bold text-primary text-uppercase mb-1">Total Books</div>
									<div class="h5 mb-0 font-weight-bold text-gray-800" th:text="${totalBooks}">0</div>
								</div>
							</div>
						</div>

						<div class="col-xl-3 col-md-6 mb-4">
							<div class="card border-left-success shadow h-100 py-2">
								<div class="card-body">
									<div class="text-xs font-weight-bold text-success text-uppercase mb-1">On Loan</div>
									<div class="h5 mb-0 font-weight-bold text-gray-800" th:text="${booksOnLoan}">0</div>
								</div>
							</div>
						</div>

						<div class="col-xl-3 col-md-6 mb-4">
							<div class="card border-left-danger shadow h-100 py-2">
								<div class="card-body">
									<div class="text-xs font-weight-bold text-danger text-uppercase mb-1">Overdue</div>
									<div class="h5 mb-0 font-weight-bold text-gray-800" th:text="${overdueCount}">0</div>
								</div>
							</div>
						</div>

						<div class="col-xl-3 col-md-6 mb-4">
							<div class="card border-left-warning shadow h-100 py-2">
								<div class="card-body">
									<div class="text-xs font-weight-bold text-warning text-uppercase mb-1">Fines Charged</div>
									<div class="h5 mb-0 font-weight-bold text-gray-800"
										th:text="'KSh ' + ${#numbers.formatDecimal(finesCharged,1,2)}">KSh 0.00</div>
								</div>
							</div>
						</div>

					</div>

					<!-- Content Row -->
					<div class="row">

						<div class="col-xl-10 col-lg-9">

							<div class="card shadow mb-4">
								<div class="card-header py-3">
									<h6 class="m-0 font-weight-bold text-primary">Books Currently On Loan</h6>
								</div>
								<div class="card-body">

									<table class="table table-borded table-stripped">

										<thead class="thead-dark">
											<tr>
												<th>Book Title</th>
												<th>Borrower</th>
												<th>Borrowed On</th>
												<th>Due Date</th>
												<th>Days Overdue</th>
												<th>Fine So Far</th>
											</tr>
										</thead>
										<tbody>
											<tr th:each="loan:${outstandingLoans}">
												<td th:text="${loan.book != null ? loan.book.title : ''}"/>
												<td th:text="${loan.member != null ? loan.member.firstName + ' ' + loan.member.lastName : ''}"/>
												<td th:text="${loan.borrowDate}"/>
												<td th:text="${loan.returnDate}"/>
												<td>
													<span th:if="${loan.daysOverdue > 0}" class="text-danger font-weight-bold"
														th:text="${loan.daysOverdue}">0</span>
													<span th:unless="${loan.daysOverdue > 0}">-</span>
												</td>
												<td>
													<span th:if="${loan.daysOverdue > 0}" class="text-danger font-weight-bold"
														th:text="'KSh ' + ${#numbers.formatDecimal(loan.fineSoFar,1,2)}">KSh 0.00</span>
													<span th:unless="${loan.daysOverdue > 0}">-</span>
												</td>
											</tr>
											<tr th:if="${#lists.isEmpty(outstandingLoans)}">
												<td colspan="6">No books are currently on loan.</td>
											</tr>
										</tbody>
									</table>
								</div>

								<hr>

							</div>

						</div>

					</div>

				</div>

			</div>
			<!-- /.container-fluid -->

			<!-- Footer -->
			<footer th:replace="layouts::footer" class="sticky-footer bg-white"></footer>
			<!-- End of Footer -->

		</div>
		<!-- End of Main Content -->



	</div>
	<!-- End of Content Wrapper -->


	<!-- End of Page Wrapper -->

	<!-- Scroll to Top Button-->
	<a th:replace="layouts::scroll" class="scroll-to-top rounded" href="#page-top"></a>

	<!-- Logout Modal-->
	<div th:replace="layouts::logout""logout"class="modal fade" id="logoutModal" tabindex="-1" role="dialog"
			aria-labelledby="exampleModalLabel" aria-hidden="true"></div>

	<!-- Bootstrap core JavaScript-->
	<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
	<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

	<!-- Core plugin JavaScript-->
	<script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>

	<!-- Custom scripts for all pages-->
	<script th:src="@{/js/sb-admin-2.min.js}"></script>



</body>

</html>
