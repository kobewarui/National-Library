<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="utf-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport"
	content="width=device-width, initial-scale=1, shrink-to-fit=no">
<meta name="description" content="">
<meta name="author" content="">

<title>PROFILE</title>

<!-- Custom fonts for this template-->
<link th:href="@{/vendor/fontawesome-free/css/all.min.css}"
	rel="stylesheet" type="text/css">
<link
	th:href="@{https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i}"
	rel="stylesheet">

<!-- Custom styles for this template-->
<link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
<link th:href="@{/css/main.css}" rel="stylesheet">
<link
	th:href="@{https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css}"
	rel="stylesheet"
	integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T"
	crossorigin="anonymous" />

</head>
<body id="page-top">

	<!-- Page Wrapper -->
	<div id="wrapper">

		<ul th:replace="layouts::sidebar"></ul>

		<!-- Content Wrapper -->
		<div id="content-wrapper" class="d-flex flex-column">

			<!-- Main Content -->
			<div id="content">

				<nav th:replace="layouts::topbar"></nav>

				<!-- Begin Page Content -->
				<div class="container-fluid">


					<!-- Content Row -->
					<div class="row">

						<div class="col-xl-10 col-lg-9">

							<!-- Borrow form Section -->

							<div class="card shadow mb-4">
								<div class="card-header py-3">

								<!-- Add Borrow Button  -->
									<a th:href="@{/newborrow}">
										<button type="button" class="btn btn-primary">Add
											Borrow</button>

									</a>


								</div>
								<div class="card-body">
									<div class="content-section container"></div>

									<table th:object = "${borrowList}" class ="table table-borded table-stripped">

									      <thead class ="thead-dark">
									      <tr>

									      <th>Book Title</th>
									      <th>Borrower</th>
									      <th>Borrow Date</th>
									      <th>Return Date</th>
									      <th>Status</th>
									      <th>Fine/Day</th>
									      <th>Fine</th>
									      <th>Return</th>
									      <th>Delete</th>

									      </tr>

									      </thead>
									      <tbody>
									      <tr th:each ="borrow:${borrowList}">
									      <td th:text ="${borrow.book != null ? borrow.book.title : ''}"/>
									      <td th:text ="${borrow.member != null ? borrow.member.firstName + ' ' + borrow.member.lastName : ''}"/>
									      <td th:text ="${borrow.borrowDate}"/>
									      <td th:text ="${borrow.returnDate}"/>
									      <td th:text ="${borrow.returned} ? 'Returned' : 'Borrowed'"/>
									      <td th:text ="'KSh ' + ${#numbers.formatDecimal(borrow.finePerDay,1,2)}"/>
									      <td th:text ="${borrow.fine > 0} ? 'KSh ' + ${#numbers.formatDecimal(borrow.fine,1,2)} : '-'"/>


									       <td>
									           <a th:if="${!borrow.returned}" th:href="@{/borrow/return(id=${borrow.id})}"
									           class = "btn btn-info btn-sm">Return</a>
									      </td>

									      <td>
									           <a th:href="@{/borrow/delete(id=${borrow.id})}"
									           class = "btn btn-danger btn-sm">Delete

									           </a>
									      </td>
									      </tr>

									      </tbody>
									      </table>
								</div>

								<hr>

							</div>

						</div>



					</div>



				</div>

			</div>
			<!-- /.container-fluid -->

			<!-- Footer -->
			<footer th:replace="layouts::footer" class="sticky-footer bg-white"></footer>
			<!-- End of Footer -->

		</div>
		<!-- End of Main Content -->


	</div>
	<!-- End of Content Wrapper -->


	<!-- End of Page Wrapper -->

	<!-- Scroll to Top Button-->
	<a th:replace="layouts::scroll" class="scroll-to-top rounded"
		href="#page-top"></a>

	<!-- Logout Modal-->
	<div th:replace="layouts::logout" "logout"class="modal fade"
		id="logoutModal" tabindex="-1" role="dialog"
		aria-labelledby="exampleModalLabel" aria-hidden="true"></div>

	<!-- Bootstrap core JavaScript-->
	<script th:src="@{/vendor/jquery/jquery.min.js}"></script>
	<script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

	<!-- Core plugin JavaScript-->
	<script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>

	<!-- Custom scripts for all pages-->
	<script th:src="@{/js/sb-admin-2.min.js}"></script>



</body>

</html>
