<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>LIBRARY</title>

    <!-- Custom fonts for this template-->
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link
        th:href="@{https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i}"
        rel="stylesheet">

    <!-- Custom styles for this template-->
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">

</head>

<body class="bg-gradient-primary">

    <div class="container">

        <div class="card o-hidden border-0 shadow-lg my-5  custom-card ">
            <div class="card-body p-0" >
                <!-- Nested Row within Card Body -->
                <div class="row" >

                    <div class="col-lg-12">
                        <div class="p-5">
                            <div class="text-center">
                              <h1><strong>NATIONAL LIBRARY</strong> </h1>
                                <h1 class="h4 text-gray-900 mb-4">Create an Account!</h1>
                            </div>
                            <form class="user" th:action="@{/user/save}" th:object="${admin}" method="post"  >
                                <!-- Error message -->
                                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
                                <div class="form-group">
                                    
                                        <input type="text" th:field ="${admin.firstName}"class="form-control form-control-user" id="exampleFirstName"
                                            placeholder="First Name" name="firstName" required autofocus = "autofocus">
                                    </div>
                                    <div class="form-group">
                                        <input type="text" th:field ="${admin.lastName}"class="form-control form-control-user" id="exampleLastName"
                                            placeholder="Last Name" name ="lastName" required autofocus = "autofocus">
                                    </div>
                                
                                <div class="form-group">
                                    <input type="email" th:field ="${admin.email}"class="form-control form-control-user" id="exampleInputEmail"
                                        placeholder="Email Address" name="email" required autofocus = "autofocus">
                                </div>
                                <div class="form-group">
                                    
                                        <input type="password" th:field ="${admin.password}"class="form-control form-control-user"
                                            id="exampleInputPassword" placeholder="Password" name ="password" required autofocus = "autofocus">
                                    
                                    
                                </div>
                                <button type="submit" class="btn btn-primary btn-user btn-block">
                                    Register Account
                                </button>
                                <hr>
                                
                            </form>
                            <hr>
                            <div class="text-center">
                                <a class="small" href="forgot-password.html">Forgot Password?</a>
                            </div>
                            <div class="text-center">
                                <a th:href="@{/user/login}" class="small">Already have an account? Login!</a>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>

    </div>

   

</body>

</html>
